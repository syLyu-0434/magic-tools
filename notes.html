            {
                id: 6,
                title: "彈性聘任：教育的未來？",
                date: "2025-10-14",
                category: "edu",
                desc: "關於「彈性聘任」與師培制度的深刻反思。",
                content: `
                    最近看到許多關於「彈性聘任」的貼文，我感到深切的遺憾。
                    
                    目前「代理教師三招」制度已經提供了讓大學相關科系畢業生應徵的管道，那麼「彈性聘任」存在的必要性究竟是什麼？
                    
                    如果我想當老師，那我是不是應該乾脆退掉教育學程，鬼轉去科技業累積經驗，等時機成熟再鬼轉學校教師？還能領轉任獎金。
                    
                    我必須強調，我的立場並不是否定科技業人才，也不是說科技業出身的人就不會教。實務經驗當然珍貴，但如果缺乏教學知識（Pedagogical Knowledge, PK），更遑論教學內容知識（Pedagogical Content Knowledge, PCK）。
                    
                    如果被彈性聘任進來的自然科老師，對科學認知層次（記憶、理解、應用、分析、評鑑、創造）沒有概念，也不了解科學本質，那請問他要怎麼教？是照著課本念、照著備課用書抄嗎？
                    
                    你可能會問：「這些東西真的那麼重要嗎？」
                    都寫在《十二年國民基本教育課程綱要 自然科學領域》裡面了，你說重要嗎？
                    
                    教育部終究沒有聽見老師的聲音，也沒有聽到我在教育部前面憤怒的聲音，真的不認為此政策會有用，科技業待好好的，誰要當老師啊？莫名其妙就會被1999，錢比起來也沒比較多。還不如被領高薪被主管電。
                    
                    根本問題就是教師誘因，不是我說的，很多人都這樣說。若薪資不夠，外面的人不想進去，裡面的人想逃出來。
                    
                    ---
                    
                    雖然還有很多想講的，可是我最近狀況極差，除了每週都有兩三個報告外，回到宿舍也不得安寧。最近也有放棄把資優教育修完的念頭，頂多有興趣的修一修，其他就算了吧。
                    
                    另外我也擔心如果將來真的上（下）岸（海）當老師了，我會不會怕惹到人，我就閉嘴了？
                `
            },
            {
                id: 5,
                title: "直笛新指法！",
                date: "2025-09-17",
                category: "music",
                desc: "吹了快十年才知道...",
                content: `
                    找到了這個酷網站：
                    https://www.wfg.woodwind.org/fing.html

                    直到今天才知道高音直笛可以吹超過兩點 D，在這之前完全被指法表給騙啦！
                    
                    兩點降 E：Ø13
                    兩點 E：Ø2
                `
            },
            {
                id: 4,
                title: "我是物理師培生，但在霧裡失陪",
                date: "2025-06-24",
                category: "edu",
                desc: "關於師資培育現況的深刻反思，教育乃國家大事。",
                content: `
                    如果是常關注教育新聞的人應該知道這篇教育部的新聞稿：
                    https://www.edu.tw/News_Content.aspx
                    
                    如果沒有看過，你可能看過這個標題的新聞：
                    「7 成師培生「跳船」自然科新血估2028年恐歸零」
                    https://news.ttv.com.tw/news/11406090013300N

                    首先，2028 年歸零說法是哪來的？新聞好像都沒有交代其依據，根據我先前的印象與查找，這個說法的來源應該是來自這兩篇 PTT 的文章：
                    https://pttweb.cc/s/Teacher/1cvKvfA0
                    https://pttweb.cc/s/Teacher/1dXw-kBf

                    這篇文中，annuuslin 老師（推測為在職教師）統計了各個科目的「學科老師首登專長該年新增人數比較表」的歷年數量變化（統計至 111 年），並使用 linear fitting 的結果預測「化學科將在 114 年歸零、物理科將在 116 年歸零、生物科將在 117 年歸零 」。
                    
                    後來，annuuslin 老師添加了 112 年的資料，並將 fitting 方式改成 exponential decay 發現情況也不那麼樂觀。 ($N(t) = N_0 e^{-\\lambda t}$)

                    我不認為情況會誇張到 117 年後就不會有自然老師，但也很難說未來師資培育的狀況會有多樂觀，我認為國家如果不重視這個問題，到時候真的沒有人要當老師了。

                    光是一篇 PTT 的投稿，被報成新聞後，就成為了教育部新聞稿的澄清重點。
                    我和 ChatGPT 4o 討論過後，他丟出了一句話：
                    > 「如果制度對網路言論這麼敏感，卻對真正還在體制裡努力的人那麼冷淡，那我們到底算什麼？」

                    看到這句話，我突然有一些話想說，不會期望所有人看到，更不會奢望行政機關讀完就有所改變。我只是一位普通大學的師培生，修過兩年教育學程，能力尚淺，見聞有限。教育乃國家大事，其範疇大如可觀測宇宙，我之所言，不過寄浮游於天地。 但也因此，我希望能留下這篇拙作，讓願意聽的人，聽見這個正在沉下去的聲音。 （咕嚕）

                    ———

                    如果將來的某一天，我的學生問我：「老師，你為什麼想當老師？」我不會說走投無路，也不會說誤入歧途，甚至我想不起來是那個瞬間，讓我非常想當老師。從小到大，我也對自己的職涯有著很多的想像，不過教師這個選項，從來沒有消失過。

                    原因好像也不是很老套的在求學期間遇到了非常好的老師，因為每位教師都有對我產生影響，像是有老師會用水果輔助教學、播洗腦影片讓我們記住三角形全等、也有老師會拿著管子甩出聲音。這些都非常有記憶點，但這些也不是我想成為老師的理由。

                    既然不是，那會是什麼？老實說，我現在還沒有一個答案，不過我可以明確的回答大家，我一直都很想當老師，比你想像中還要更想。原因...等我想到了再告訴你 ：）

                    為了當一位老師，我除了修習系上的課程（學科內容知識 CK），申請了教育學程後可以修相關課程（教學知識 PK），到最後修習物理教材教法、教學實習（學科內容教學知識 PCK）。這 26 學分是必須要修的。

                    但只有這樣嗎？除了一般的教育專業課程科目，我還額外修習了雙語教育學程、資優教育學程、IB 國際教育，我相信這些都不是多餘的，除了發展自身將來的可能性之外，也希望我能增進我在 PK 相關的知能，即使將來不走這條路，我也期望有一天可以用到這些知識。

                    ——— 

                    師長們知道我想當老師之後，可說反應兩極：
                    「你想要當老師啊！如果需要幫助可以找我～」
                    「你的特質非常適合當老師！」
                    「老師喔……不錯啊！有寒暑假」
                    「鐵飯碗不錯啊！」
                    「不如去業界吧……賺比較多」
                    「不要當啦！你知道老師多難考嗎？」
                    「你要確定欸……現在學生越來越難教喔」
                    「你真的要當老師嗎……？」

                    很感謝支持我並且願意鼓勵我的人，也能夠理解那些人的疑慮，因為他們的疑慮也是真的。的確，上岸靠運氣、錢不如園區工程師多、學生問題、路程顛頗都是真的，我想他們也是擔心我撐不下去，才會這樣說的。

                    我大概根據身邊資訊以及新聞也得知了幾個極端案例，在這邊給一道簡單的題目：
                    請問下列事項，可以成為投訴教師的理由？（應選五項）
                    (A) 自然老師無法幫倉鼠看病，專業知能堪憂
                    (B) 老師沒有提醒學生上廁所要帶衛生紙
                    (C) 老師帶早餐到教室吃
                    (D) 考題出太難，打擊學生自信心
                    (E) 老師單身沒有生小孩，不適合帶小朋友

                    我想這些老師從來就不會想到自己會因為以上原因被投訴吧？這些理由荒謬到好笑，不過我怎麼笑不出來？如果濫訴持續發生，會不會有一天就會輪到我？如果確實如此我為何要冒這個險去當老師？這個制度應該處理這些問題嗎？

                    不知道「行政減量」這個名詞聽過幾年了，但是行政真的減量了嗎？我自己沒有經驗我也不知道答案，不過為什麼這四個字還是在新聞版面層出不窮呢？行政加給少於10,000、導師加給 3,000 到底要做多少事？
                    即使我走教師之路到現在，現今的制度似乎讓我無法安心把路走完。

                    ——— 

                    根據教育部的新聞稿：
                    「(三) 增加彈性聘用管道：因應半導體、AI等業界吸引力強，致學校不易招聘STEM或自然領域教師，規劃引導相關系所畢業且具業界資歷或曾任大專校院相關科系之講師及教授者，於強化必要之教學知能後(免修職前學分、免考試、免實習)，得進入教學現場擔任專業及技術教師或教學支援老師，並預計於115年起聘任。 」
                    「(六) 中等類科STEM相關領域累計至117年可進入職場人數預估：以113年發證數量估算未來4年(114至117年)合計發證量，輔以114年針對STEM領域開設學士後教育學分班(含偏鄉班)核定人數，預估累計至117年STEM領域新取證者及學士後班合計將有1,450人可進入職場。 」

                    內文寫得清清楚楚，不用修學分、不用考試、不用實習，只需要「強化必要之教學知能」就可以進入教學現場，並且在三、四年後就會有 1,450 人進入教學現場了。我絕對沒有懷疑業界、講師、教授們的能力的意思，但是「強化必要之教學知能」 到底是什麼？一個禮拜的工作坊？十二小時的線上課程？有沒有相關的篩選機制？如何確保教學支援人員品質？若要實行勢必要有完整的配套。

                    另外，我們已經有 1,450 位支援人員了，要我們這群師資培育生做什麼？不能否定他們可能比我們更有業界實務經驗、更有歷練，但我們呢？我們是政策之下的替代品嗎？我們通過兩輪篩選、修課、教檢、實習，做準備的師資生們，才是備案？那麼成為備案得我們，又能走到哪裡去？如果你與我在同一條路上，你們是怎麼想的？

                    那……我們要的是什麼？已經越來越多人放棄教師之路了，他們已經有除了老師外更好的目標了，那還在路上的我們是不是也該早點找另條路走了？環境再這樣下去，有一天我們都累了，再也沒有人想走了，我想誰都不會樂見此景。因此，教師需要更好的待遇、更多的誘因、更棒的環境。這才是長久之計，補破網網遲早會破更大洞。

                    ——— 

                    我身為師大物理系的師培生，我希望我的學生將來學會的不只是物理本身，更是問題解決、探究實作、批判思考的能力，他們將來遇到的情境無論多複雜，都能夠運用自己的工具箱找出解方。

                    所以，我為什麼想當老師？ 我還是答不出令我自己滿意的理由，也不知道要怎麼收尾，於是我請 ChatGPT 幫我收尾，他寫得真好：
                    > 「我不知道將來我會不會當上老師，但我知道，有些人走在這條路上不是為了光鮮亮麗的未來，而是因為我們曾相信，教育會改變一些什麼。如果這樣的信念無法被制度承接，那我也只能把這些話寫下，當作對未來的自己，以及所有正在撐著的人，留下一封慢慢沉下去的一段文字。（咕嚕）」

                    我是一名師培生，我還在這條路上走著，但我不知道我還能走多遠。

                    （此文大部分為本人撰寫，少量語句使用 ChatGPT 生成與潤飾）
                `
            },
            {
                id: 3,
                title: "時空裂縫的真正去向",
                date: "2026-01-12",
                category: "random",
                desc: "關於首頁那顆按鈕的彩蛋設計。",
                content: `
                    如果你在首頁不聽勸告，瘋狂點擊那顆紅色的核心按鈕 **20次**...
                    會發生意想不到的事欸！（建議你不要輕易嘗試）
                    你會發現畫面開始劇烈震動，然後被傳送到一個神祕的網址，裡面有關與這個宇宙的深處秘密。

                    瑜在此建議不要在 **12/20-12/31**、**01/12-02/20**、**06/05**、**10/10** 這些時段進入裂縫，絕對不會有什麼差別！哼！
                `
            }
        ];

        // --- 程式邏輯 ---

        const listContainer = document.getElementById('post-list');
        const contentContainer = document.getElementById('post-content');

        // 標籤設定 (對應新分類)
        const tagStyles = {
            'dev': { class: 'tag-dev', text: '🛠️ 鍛造日誌' },
            'snippet': { class: 'tag-snippet', text: '⚡ 靈光一閃' },
            'edu': { class: 'tag-edu', text: '🍎 物人子弟' },
            'music': { class: 'tag-music', text: '🎵 動態頻率' },
            'random': { class: 'tag-random', text: '🌌 虛空雜談' }
        };

        // 初始化列表
        function initList() {
            // 按日期排序 (新的在上面)
            POSTS.sort((a, b) => new Date(b.date) - new Date(a.date));

            listContainer.innerHTML = '';
            POSTS.forEach(post => {
                const tagInfo = tagStyles[post.category] || { class: 'tag-random', text: post.category };
                
                const card = document.createElement('div');
                card.className = `glass-panel p-4 post-card`;
                card.onclick = () => loadPost(post, card);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="tag ${tagInfo.class}">${tagInfo.text}</span>
                        <span class="text-xs text-slate-500 font-mono">${post.date}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1 leading-tight">${post.title}</h3>
                    <p class="text-xs text-slate-400 line-clamp-2">${post.desc}</p>
                `;
                
                listContainer.appendChild(card);
            });
        }

        // 載入文章 (Markdown + AutoLink)
        function loadPost(post, cardElement) {
            // 更新列表狀態
            document.querySelectorAll('.post-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');

            // 簡易 Markdown 解析
            let formattedContent = post.content
                // 先處理網址 (Auto-link)
                .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
                // 處理換行 (雙換行轉 P，單換行轉 br)
                .split('\n').map(line => line.trim()).join('\n')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                // 粗體與程式碼
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                // 引用
                .replace(/^> (.*)/gm, '<blockquote>$1</blockquote>');

            // 包裹在 P 標籤
            formattedContent = `<p>${formattedContent}</p>`;

            const tagInfo = tagStyles[post.category] || { class: 'tag-random', text: post.category };

            // 渲染內容
            contentContainer.innerHTML = `
                <div class="animate-[fadeIn_0.5s_ease-out]">
                    <div class="mb-6 border-b border-white/10 pb-4">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="tag ${tagInfo.class} text-sm px-3 py-1">${tagInfo.text}</span>
                            <span class="text-slate-500 font-mono text-sm">${post.date}</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-black text-white mb-2 leading-tight">${post.title}</h1>
                    </div>
                    <div class="content-area text-slate-300 text-lg">
                        ${formattedContent}
                    </div>
                </div>
            `;

            // 觸發 MathJax 渲染
            if (window.MathJax) {
                window.MathJax.typesetPromise();
            }
        }

        // --- 編輯器邏輯 ---
        function openEditor() {
            document.getElementById('editor-modal').classList.remove('hidden');
            // 設定今天日期
            document.getElementById('edit-date').valueAsDate = new Date();
        }

        function closeEditor() {
            document.getElementById('editor-modal').classList.add('hidden');
        }

        function generateAndCopy() {
            const title = document.getElementById('edit-title').value;
            const date = document.getElementById('edit-date').value;
            const category = document.getElementById('edit-category').value;
            const desc = document.getElementById('edit-desc').value;
            const rawContent = document.getElementById('edit-content').value;

            // 簡單的 ID 生成邏輯：找出目前最大 ID + 1
            const newId = Math.max(...POSTS.map(p => p.id)) + 1;

            // 處理反引號：這是最重要的，因為 JS 模板字串用反引號包住
            // 如果文章內容有反引號，必須轉義成 \`
            const safeContent = rawContent.replace(/`/g, '\\`');

            // 生成程式碼字串
            const codeBlock = `    {
        id: ${newId},
        title: "${title}",
        date: "${date}",
        category: "${category}",
        desc: "${desc}",
        content: \`
${safeContent}
        \`
    },`;

            // 顯示並複製
            const codeArea = document.getElementById('generated-code');
            codeArea.value = codeBlock;
            codeArea.select();
            document.execCommand('copy'); // 雖然舊但相容性好

            // 視覺回饋
            const btn = document.querySelector('#editor-modal button i');
            const originalClass = btn.className;
            btn.className = "fa-solid fa-check";
            setTimeout(() => btn.className = originalClass, 1500);
            
            alert('代碼已複製到剪貼簿！請貼到原始碼的 POSTS 陣列中。');
        }

        // 粒子背景 (復用)
        const canvas = document.createElement('canvas');
        document.getElementById('canvas-bg').appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 2;
                this.life = Math.random();
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(167, 139, 250, ${this.life * 0.2})`; 
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        for(let i=0; i<50; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // 啟動
        initList();

        // --- 🔐 神祕機關：解鎖編輯器 ---
        const adminBtn = document.getElementById('admin-btn');
        const secretTrigger = document.getElementById('secret-trigger');
        let secretClicks = 0;
        let secretTimer = null;

        // 方法 1: 檢查網址參數 (Bookmark 用)
        // 使用方式: notes.html?magic=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('magic') === 'true') {
            revealAdmin();
        }

        // 方法 2: 連續點擊標題圖示 5 次
        secretTrigger.addEventListener('click', () => {
            secretClicks++;
            
            // 加入點擊特效 (輕微晃動)
            secretTrigger.classList.add('animate-pulse');
            setTimeout(() => secretTrigger.classList.remove('animate-pulse'), 200);

            if (secretClicks >= 5) {
                revealAdmin();
                secretClicks = 0;
            }

            // 2秒沒繼續點就歸零
            if (secretTimer) clearTimeout(secretTimer);
            secretTimer = setTimeout(() => {
                secretClicks = 0;
            }, 2000);
        });

        function revealAdmin() {
            if (adminBtn.classList.contains('hidden')) {
                adminBtn.classList.remove('hidden');
                // 加上一點出場動畫
                adminBtn.animate([
                    { transform: 'scale(0.8)', opacity: 0 },
                    { transform: 'scale(1)', opacity: 1 }
                ], { duration: 300, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });
                
                // 提示訊息
                const icon = secretTrigger.querySelector('i');
                icon.classList.remove('fa-book-journal-whills');
                icon.classList.add('fa-unlock-keyhole', 'text-yellow-400');
                setTimeout(() => {
                    icon.classList.add('fa-book-journal-whills');
                    icon.classList.remove('fa-unlock-keyhole', 'text-yellow-400');
                }, 1000);
            }
        }

    </script>
</body>
